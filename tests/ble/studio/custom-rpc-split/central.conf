# The split central additionally enables ZMK Studio + this module's custom RPC
# subsystem: the sample RPC answers the host over the Studio BLE GATT
# transport AND triggers the relay of its value to the peripheral.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_FEATURE_TYPING_HEATMAP_STUDIO_RPC=y

CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

CONFIG_ZMK_FEATURE_TYPING_HEATMAP_BLE_TEST=y
